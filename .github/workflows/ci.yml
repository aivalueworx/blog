name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout vault-shared (for post content)
        uses: actions/checkout@v4
        with:
          repository: aivalueworx/vault-shared
          path: _vault-shared
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync posts from vault-shared
        run: |
          mkdir -p src/posts/imported
          rm -f src/posts/imported/*.md 2>/dev/null || true
          cp _vault-shared/published/blog/*.md src/posts/imported/ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
